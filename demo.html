<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pixel World — Live Demo</title>
  <link rel="icon" href="data:,?" />
  <style>
    :root { --gold: #ffd23f; --bg: #060a10; --card: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.08); --text: #dce4ee; --muted: #7a8fa6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { width: 100%; height: 100%; background: #04070d; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; overflow: hidden; }
    body { width: 100%; height: 100%; background: transparent; color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
              max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      position: relative; z-index: 1; }

    /* ── Globe canvas — scales with viewport ─────── */
    #globe-wrap { position: relative; width: min(200px, 42vmin); height: min(200px, 42vmin); flex-shrink: 0; margin-bottom: min(16px, 3.5vmin); }
    #globe-canvas { width: 100%; height: 100%; border-radius: 50%; display: block;
      box-shadow: 0 0 min(50px,10vmin) min(8px,2vmin) rgba(90,170,90,0.18), 0 0 min(120px,24vmin) min(30px,6vmin) rgba(30,90,160,0.1); }
    .globe-stat {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      text-align: center; pointer-events: none; z-index: 2;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    }
    .globe-stat .num { font-size: min(36px, 8vmin); font-weight: 800; color: #fff; line-height: 1; }
    .globe-stat .label { font-size: min(10px, 2.2vmin); font-weight: 600; color: rgba(255,255,255,0.6);
      text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }

    /* ── Title ────────────────────────────────────── */
    .title { text-align: center; margin-bottom: min(12px, 2.5vmin); flex-shrink: 0; }
    .title h1 { font-size: clamp(20px, 5.5vmin, 32px); font-weight: 800; letter-spacing: -0.02em; }
    .title h1 span { color: var(--gold); }
    .title p { font-size: clamp(11px, 2.5vmin, 14px); color: var(--muted); margin-top: 2px; }

    /* ── Spawn card ────────────────────────────────── */
    .spawn-card {
      width: 100%; max-width: 340px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: min(14px, 3vmin); padding: min(14px, 3vmin) min(16px, 3.5vmin);
      flex-shrink: 0; margin-bottom: min(10px, 2vmin);
    }
    .human-row { display: flex; align-items: center; gap: min(12px, 2.5vmin); margin-bottom: min(12px, 2.5vmin); }
    #human {
      width: 44px; height: 52px; image-rendering: pixelated;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,224,138,0.3);
      border-radius: 6px; flex-shrink: 0;
    }
    .human-info .name { font-size: min(17px, 3.8vmin); font-weight: 700; color: var(--gold); }
    .human-info .desc { font-size: min(11px, 2.4vmin); color: var(--muted); margin-top: 1px; }
    .spawn-actions { display: flex; gap: min(8px, 1.8vmin); }
    .btn-enter {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: min(5px, 1vmin);
      padding: min(11px, 2.5vmin) min(14px, 3vmin); border: none; border-radius: min(10px, 2.2vmin);
      background: linear-gradient(135deg, var(--gold), #f0a63c);
      color: #1a1205; font: 700 min(13px, 3vmin) -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer; transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 4px min(16px, 3.5vmin) rgba(255,180,60,0.3);
    }
    .btn-enter:hover { transform: translateY(-1px); }
    .btn-enter:active { transform: scale(0.97); }
    .btn-reroll {
      padding: min(11px, 2.5vmin) min(13px, 2.8vmin); border: 1px solid var(--border); border-radius: min(10px, 2.2vmin);
      background: var(--card); color: var(--text);
      font: 600 min(12px, 2.8vmin) -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-reroll:hover { background: rgba(255,255,255,0.08); }

    /* ── Feature pills ─────────────────────────────── */
    .features {
      display: flex; flex-wrap: wrap; justify-content: center; gap: min(5px, 1.2vmin);
      max-width: 420px; margin-bottom: min(8px, 1.8vmin); flex-shrink: 0;
    }
    .pill {
      display: flex; align-items: center; gap: 4px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: min(8px, 1.8vmin); padding: min(5px, 1.2vmin) min(8px, 1.8vmin);
      font-size: min(10px, 2.3vmin); color: var(--muted);
    }

    /* ── Footer ────────────────────────────────────── */
    .footer { font-size: min(9px, 2vmin); color: rgba(122,143,166,0.5); text-align: center; flex-shrink: 0; }

    /* ── Loading overlay ───────────────────────────── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 999; background: var(--bg);
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    #loading-overlay.show { display: flex; }
    .loader-ring {
      width: 36px; height: 36px; border: 3px solid rgba(255,210,63,0.15);
      border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { color: var(--muted); font-size: 13px; }
    body.zooming { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }

    /* ── Small screens (under 380px) ──────────────── */
    @media (max-height: 640px) {
      #globe-wrap { margin-bottom: 8px; }
      .title { margin-bottom: 6px; }
      .spawn-card { margin-bottom: 6px; padding: 10px 14px; }
      .human-row { margin-bottom: 8px; }
      .features { gap: 4px; margin-bottom: 4px; }
      .pill { padding: 3px 6px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="space-bg" style="position:fixed;inset:0;background:radial-gradient(circle at 50% 30%, #0c1424 0%, #03060c 100%);z-index:-2;pointer-events:none;"></div>
  <canvas id="starfield-bg" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;"></canvas>
  <div id="loading-overlay"><div class="loader-ring"></div><div class="loader-text">Entering the world…</div></div>

  <div id="globe-wrap">
    <canvas id="globe-canvas" width="400" height="400"></canvas>
    <div class="globe-stat">
      <div class="num" id="player-count">1</div>
      <div class="label">online</div>
    </div>
  </div>

  <div class="title">
    <div style="font-size: 9px; font-weight: 500; color: rgba(255, 210, 63, 0.55); margin-bottom: 2px;">v53</div>
    <h1><span>Pixel World</span></h1>
    <p>Multiplayer pixel campfire · No sign-up required</p>
  </div>

  <div class="spawn-card">
    <div class="human-row">
      <canvas id="human" width="52" height="60"></canvas>
      <div class="human-info">
        <div class="name" id="human-name">Grok</div>
        <div class="desc" id="human-desc">caveman · adult</div>
      </div>
    </div>
    <div class="spawn-actions">
      <button class="btn-reroll" id="reroll">🎲</button>
      <button class="btn-enter" id="spawn">✨ 🌍 Enter the world ✨</button>
    </div>
  </div>

  <div class="features">
    <a href="https://github.com/FREECANDY-DEV/pixel-world" target="_blank" class="pill" style="text-decoration:none;color:#ffd23f;border-color:rgba(255,210,63,0.45);background:rgba(255,210,63,0.12);font-weight:600;transition:transform 0.15s, background 0.15s;"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:-1px;margin-right:2px;"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg> Star on GitHub <span id="gh-star-count" style="margin-left:3px;opacity:0.85;">★</span></a>
    <div class="pill">👥 Live players</div>
    <div class="pill">💬 Chat</div>
    <div class="pill">👆 Drag to look</div>
  </div>

  <div class="footer">MQTT-powered · Zero accounts</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    (function () {
      const cv = document.getElementById('globe-canvas');
      const renderer = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(cv.clientWidth || 200, cv.clientHeight || 200, false);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);

      // --- 1. Procedural Earth Texture ---
      const texW = 512, texH = 256;
      const texC = document.createElement('canvas');
      texC.width = texW; texC.height = texH;
      const tg = texC.getContext('2d');
      const imgData = tg.createImageData(texW, texH);
      const px = imgData.data;
      for (let y = 0; y < texH; y++) {
        const lat = (y / texH - 0.5) * Math.PI;
        for (let x = 0; x < texW; x++) {
          const lon = (x / texW) * Math.PI * 2;
          const nx = Math.cos(lat) * Math.cos(lon);
          const ny = Math.sin(lat);
          const nz = Math.cos(lat) * Math.sin(lon);
          const v = Math.sin(nx * 3.2 + 0.5) * Math.cos(ny * 2.8 - 0.3) * Math.sin(nz * 2.5 + 1.1)
            + Math.sin(nx * 6.1 + ny * 4.3) * 0.3
            + Math.cos(nz * 7.2 - nx * 2.1) * 0.2;
          const land = v > 0.15;
          let r, g, b;
          if (Math.abs(lat) > 1.1) { r = 236; g = 241; b = 248; }
          else if (land) {
            const elev = (v - 0.15) / 0.85;
            if (elev > 0.65) { r = 120; g = 115; b = 105; }
            else { r = 45 + elev * 35; g = 115 + elev * 20; b = 45 + elev * 15; }
          } else {
            const deep = (0.15 - v) / 0.8;
            r = 15 + deep * 10; g = 50 + deep * 20; b = 115 + deep * 35;
          }
          const i = (y * texW + x) * 4;
          px[i] = r; px[i + 1] = g; px[i + 2] = b; px[i + 3] = 255;
        }
      }
      tg.putImageData(imgData, 0, 0);
      const earthTex = new THREE.CanvasTexture(texC);

      // --- 2. Procedural Moon Texture ---
      const mTexC = document.createElement('canvas');
      mTexC.width = 128; mTexC.height = 64;
      const mg = mTexC.getContext('2d');
      mg.fillStyle = '#9e9fa5';
      mg.fillRect(0, 0, 128, 64);
      mg.fillStyle = '#6b6c72';
      for (let i = 0; i < 35; i++) {
        const cx = Math.random() * 128, cy = Math.random() * 64, cr = 1.5 + Math.random() * 5.5;
        mg.beginPath(); mg.arc(cx, cy, cr, 0, Math.PI * 2); mg.fill();
      }
      const moonTex = new THREE.CanvasTexture(mTexC);

      // --- 3. Sun Flare Texture ---
      const sTexC = document.createElement('canvas');
      sTexC.width = 128; sTexC.height = 128;
      const sg = sTexC.getContext('2d');
      const grad = sg.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(255,255,240,1)');
      grad.addColorStop(0.2, 'rgba(255,210,63,0.85)');
      grad.addColorStop(0.5, 'rgba(255,140,20,0.4)');
      grad.addColorStop(1, 'rgba(255,80,0,0)');
      sg.fillStyle = grad;
      sg.fillRect(0, 0, 128, 128);
      const sunFlareTex = new THREE.CanvasTexture(sTexC);

      // --- 4. Objects ---
      // Sun (HUGE glowing star always in background)
      const sunGroup = new THREE.Group();
      sunGroup.position.set(0, 20, -260);

      // Huge Sun Sphere
      const sunMesh = new THREE.Mesh(
        new THREE.SphereGeometry(80, 48, 48),
        new THREE.MeshBasicMaterial({ color: 0xffea70 })
      );
      sunGroup.add(sunMesh);

      // Inner Corona Glow
      const sunSprite = new THREE.Sprite(
        new THREE.SpriteMaterial({ map: sunFlareTex, transparent: true, blending: THREE.AdditiveBlending })
      );
      sunSprite.scale.set(450, 450, 1);
      sunGroup.add(sunSprite);

      // Outer Deep Space Solar Flare
      const sunOuterSprite = new THREE.Sprite(
        new THREE.SpriteMaterial({ map: sunFlareTex, transparent: true, blending: THREE.AdditiveBlending, opacity: 0.5 })
      );
      sunOuterSprite.scale.set(750, 750, 1);
      sunGroup.add(sunOuterSprite);

      scene.add(sunGroup);

      const sunLight = new THREE.PointLight(0xfffaed, 6.5, 1500);
      sunLight.position.copy(sunGroup.position);
      scene.add(sunLight);

      const ambientLight = new THREE.AmbientLight(0x223344, 0.85);
      scene.add(ambientLight);

      // Earth Globe
      const earthGroup = new THREE.Group();
      const earthMesh = new THREE.Mesh(
        new THREE.SphereGeometry(14, 48, 48),
        new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.7, metalness: 0.1 })
      );
      earthGroup.add(earthMesh);

      // Earth Atmosphere Glow
      const atmosMesh = new THREE.Mesh(
        new THREE.SphereGeometry(14.8, 32, 32),
        new THREE.MeshBasicMaterial({ color: 0x64b4ff, transparent: true, opacity: 0.2, side: THREE.BackSide })
      );
      earthGroup.add(atmosMesh);
      scene.add(earthGroup);

      // Moon (rotates around Earth)
      const moonMesh = new THREE.Mesh(
        new THREE.SphereGeometry(3.5, 32, 32),
        new THREE.MeshStandardMaterial({ map: moonTex, roughness: 0.9 })
      );
      scene.add(moonMesh);

      // Starfield Background (twinkling 3D space stars)
      const starGeo = new THREE.BufferGeometry();
      const starCount = 1200;
      const starPos = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        starPos[i * 3] = (Math.random() - 0.5) * 700;
        starPos[i * 3 + 1] = (Math.random() - 0.5) * 700;
        starPos[i * 3 + 2] = (Math.random() - 0.5) * 700;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.4, transparent: true, opacity: 0.9 });
      const stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);

      // --- 5. Animation Loop ---
      let startT = performance.now();
      function animate() {
        requestAnimationFrame(animate);
        const t = (performance.now() - startT) * 0.001;

        // Twinkling 3D starfield animation
        stars.rotation.y = t * 0.015;
        starMat.size = 1.3 + Math.sin(t * 1.8) * 0.35;

        // Earth orbits Sun slowly in background
        const earthOrbitAngle = t * 0.04;
        earthGroup.position.x = sunGroup.position.x + Math.sin(earthOrbitAngle) * 40;
        earthGroup.position.z = sunGroup.position.z + 160;
        earthMesh.rotation.y = t * 0.22; // Earth spins on its axis

        // Moon orbits Earth (globus)
        const moonOrbitAngle = t * 0.65;
        moonMesh.position.x = earthGroup.position.x + Math.cos(moonOrbitAngle) * 26;
        moonMesh.position.z = earthGroup.position.z + Math.sin(moonOrbitAngle) * 26;
        moonMesh.position.y = earthGroup.position.y + Math.sin(moonOrbitAngle * 0.8) * 6;
        moonMesh.rotation.y = t * 0.2;

        // Camera sways gracefully in front of Earth facing toward the Sun
        const camSway = Math.sin(t * 0.25) * 22;
        camera.position.x = earthGroup.position.x + camSway;
        camera.position.z = earthGroup.position.z + 46;
        camera.position.y = earthGroup.position.y + 8 + Math.sin(t * 0.15) * 3;
        camera.lookAt(earthGroup.position.x * 0.4, earthGroup.position.y, earthGroup.position.z - 20);

        renderer.render(scene, camera);
      }
      animate();

      // Fetch live GitHub Stars count
      try {
        fetch('https://api.github.com/repos/FREECANDY-DEV/pixel-world')
          .then((res) => res.json())
          .then((data) => {
            if (data && data.stargazers_count != null) {
              const el = document.getElementById('gh-star-count');
              if (el) el.textContent = '★ ' + data.stargazers_count;
            }
          }).catch(() => {});
      } catch (e) {}

      window.addEventListener('resize', () => {
        const w = cv.clientWidth || 200, h = cv.clientHeight || 200;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      });
    })();
  </script>

  <script>
    // ================================================================
    // 2. Static online counter via MQTT
    // ================================================================
    (function () {
      const TOPIC = 'pixelworld/demo/v1';
      const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
      const TTL = 45000;
      const players = new Map();
      const countEl = document.getElementById('player-count');
      function update() { countEl.textContent = Math.max(1, players.size); }
      function sweep() {
        const now = Date.now();
        for (const [id, ts] of players) if (now - ts > TTL) players.delete(id);
        update();
      }
      setInterval(sweep, 5000);
      function connect(i) {
        if (i >= BROKERS.length || typeof mqtt === 'undefined') { update(); return; }
        const c = mqtt.connect(BROKERS[i], {
          clientId: 'pw-page-' + Math.random().toString(36).slice(2, 10),
          connectTimeout: 8000, reconnectPeriod: 5000, keepalive: 30,
        });
        let once = false;
        c.on('connect', () => { once = true; c.subscribe([TOPIC + '/presence/+', TOPIC + '/pos'], { qos: 0 }, () => update()); });
        c.on('message', (topic, payload) => {
          const txt = payload.toString();
          if (topic.startsWith(TOPIC + '/presence/')) {
            const id = topic.slice(topic.lastIndexOf('/') + 1);
            if (!txt) players.delete(id);
            else try { players.set(JSON.parse(txt).id, Date.now()); } catch (e) {}
          } else if (topic.endsWith('/pos')) {
            try { const m = JSON.parse(txt); if (m.id) players.set(m.id, Date.now()); } catch (e) {}
          }
          update();
        });
        c.on('close', () => { if (!once) setTimeout(() => connect(i + 1), 800); });
      }
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js';
      s.onload = () => connect(0);
      document.head.appendChild(s);
    })();

    // ================================================================
    // 3. Yellow Hazard Suit Human Pixel-Art Preview
    // ================================================================
    const SUBJECT_CODES = ['Alpha', 'Beta', 'Gamma', 'Delta', 'Echo', 'Zeta', 'Zero', 'Prime', 'Apex', 'Nova', 'Orion', 'Vortex', '704', '912', '308', '007'];

    const HAZMAT_HUMAN = [
      '.....YYYYYY.....', // Hood Top
      '....YYYYYYYY....', // Hood Dome
      '....YVVVVVVY....', // Dark Visor
      '....YVVGGVVY....', // Visor Cyan Glass Reflection
      '....YVVVVVVY....', // Visor Bottom
      '....YYRRRYYY....', // Gas Mask Respirator Box
      '....YYYYYYYY....', // Hood Chin/Neck
      '.....YYYYYY.....',
      '......YY........',
      '....YYYYYYYY....', // Shoulders
      '....YBBBBBYY....', // Utility Belt
      '...YYYYYYYYYY...', // Suit Body
      '...YYBBAAYY.....', // Hazard Stripes & Badge
      '...YYYYYYYYYY...',
      '....YYYYYY......',
      '....KK..KK......', // Black Rubber Boots
      '....KK..KK......',
      '....KK..KK......',
      '....KK..KK......',
    ];
    const HAZMAT_PALETTE = {
      Y: '#ffd23f', // Hazmat Yellow
      V: '#0f172a', // Dark Glass Visor
      G: '#38bdf8', // Cyan Glass Reflection
      R: '#475569', // Respirator Box
      B: '#1e293b', // Black Belts
      A: '#e11d48', // Red Biohazard Badge
      K: '#0f172a'  // Black Boots
    };

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    let currentLook = null;
    function rollHuman() {
      const code = pick(SUBJECT_CODES);
      const name = 'Subject-' + code;
      const age = 25;
      const female = false;
      const skin = '#ffd23f', hair = '#111827', cloth = '#ffd23f', eye = '#111827', dress = null;
      const style = 0, beard = -1;

      const cv = document.getElementById('human');
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, cv.width, cv.height);
      const cols = HAZMAT_HUMAN[0].length, rows = HAZMAT_HUMAN.length, s = 2;
      const ox = Math.floor((cv.width - cols * s) / 2);
      const oy = Math.floor((cv.height - rows * s) / 2);
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const c = HAZMAT_PALETTE[HAZMAT_HUMAN[y][x]]; if (!c) continue;
        ctx.fillStyle = c; ctx.fillRect(ox + x * s, oy + y * s, s, s);
      }
      document.getElementById('human-name').textContent = name;
      document.getElementById('human-desc').textContent = 'Yellow Hazard Suit · Hazmat Unit';
      currentLook = { female, name, age, skin, hair, grey: '#c9c9c9', cloth, dress, eyes: eye, style, beard };
    }
    document.getElementById('reroll').addEventListener('click', rollHuman);
    rollHuman();

    // ================================================================
    // 4. Spawn → zoom + navigate
    // ================================================================
    document.getElementById('spawn').addEventListener('click', (e) => {
      e.preventDefault();
      const L = currentLook;
      const p = new URLSearchParams({
        demo: '1', n: L.name, f: L.female ? '1' : '0', a: String(L.age),
        skin: L.skin, hair: L.hair, grey: L.grey, cloth: L.cloth, eyes: L.eyes,
        style: String(L.style), beard: String(Math.max(0, L.beard)),
      });
      if (L.dress) p.set('dress', L.dress);
      document.body.classList.add('zooming');
      setTimeout(() => {
        document.getElementById('loading-overlay').classList.add('show');
        setTimeout(() => { window.location.href = 'index.html?' + p.toString(); }, 400);
      }, 500);
    });

    // ================================================================
    // 5. Full-Viewport Classic Minimalist & Realistic Starfield
    // ================================================================
    (function initStarfieldBG() {
      const scv = document.getElementById('starfield-bg');
      if (!scv) return;
      const sctx = scv.getContext('2d');
      let sw = 0, sh = 0, stars = [], meteors = [];

      function resize() {
        sw = scv.width = window.innerWidth;
        sh = scv.height = window.innerHeight;
        stars = [];
        const count = Math.floor((sw * sh) / 3200);
        const colors = ['#ffffff', '#ffffff', '#e8f0fe', '#ffe8d6', '#cce3ff'];
        for (let i = 0; i < count; i++) {
          const rRand = Math.random();
          const r = rRand > 0.95 ? 1.2 : (rRand > 0.7 ? 0.9 : 0.6);
          stars.push({
            x: Math.random() * sw, y: Math.random() * sh,
            r,
            alpha: Math.random() * 0.6 + 0.15,
            speed: Math.random() * 0.03 + 0.01,
            phase: Math.random() * Math.PI * 2,
            color: colors[Math.floor(Math.random() * colors.length)],
          });
        }
      }
      window.addEventListener('resize', resize);
      resize();

      function draw() {
        sctx.clearRect(0, 0, sw, sh);
        const t = performance.now() * 0.001;

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const a = s.alpha * (0.65 + 0.35 * Math.sin(t * (s.speed * 40) + s.phase));
          sctx.fillStyle = s.color;
          sctx.globalAlpha = Math.max(0, Math.min(1, a));

          sctx.beginPath();
          sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          sctx.fill();

          if (s.r > 1.0 && a > 0.5) {
            sctx.globalAlpha = a * 0.25;
            sctx.beginPath();
            sctx.arc(s.x, s.y, s.r * 2.2, 0, Math.PI * 2);
            sctx.fill();
          }
        }

        if (Math.random() < 0.008 && meteors.length < 1) {
          meteors.push({
            x: Math.random() * (sw * 0.8), y: Math.random() * (sh * 0.4),
            len: Math.random() * 60 + 30, speed: Math.random() * 6 + 4,
            angle: Math.PI / 4 + (Math.random() - 0.5) * 0.15, alpha: 0.8,
          });
        }

        for (let i = meteors.length - 1; i >= 0; i--) {
          const m = meteors[i];
          const endX = m.x - Math.cos(m.angle) * m.len;
          const endY = m.y - Math.sin(m.angle) * m.len;
          const grad = sctx.createLinearGradient(m.x, m.y, endX, endY);
          grad.addColorStop(0, 'rgba(255, 255, 255, ' + (m.alpha * 0.8) + ')');
          grad.addColorStop(0.4, 'rgba(232, 240, 254, ' + (m.alpha * 0.4) + ')');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          sctx.strokeStyle = grad;
          sctx.lineWidth = 1.0;
          sctx.globalAlpha = 1;
          sctx.beginPath();
          sctx.moveTo(m.x, m.y);
          sctx.lineTo(endX, endY);
          sctx.stroke();

          m.x += Math.cos(m.angle) * m.speed;
          m.y += Math.sin(m.angle) * m.speed;
          m.alpha -= 0.02;
          if (m.alpha <= 0 || m.x > sw || m.y > sh) meteors.splice(i, 1);
        }

        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
