<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pixel World — Live Demo</title>
  <link rel="icon" href="data:,?" />
  <style>
    :root { --gold: #ffd23f; --bg: #060a10; --card: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.08); --text: #dce4ee; --muted: #7a8fa6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; overflow: hidden; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
              max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }

    /* ── Globe canvas — scales with viewport ─────── */
    #globe-wrap { position: relative; width: min(200px, 42vmin); height: min(200px, 42vmin); flex-shrink: 0; margin-bottom: min(16px, 3.5vmin); }
    #globe-canvas { width: 100%; height: 100%; border-radius: 50%; display: block;
      box-shadow: 0 0 min(50px,10vmin) min(8px,2vmin) rgba(90,170,90,0.18), 0 0 min(120px,24vmin) min(30px,6vmin) rgba(30,90,160,0.1); }
    .globe-stat {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      text-align: center; pointer-events: none; z-index: 2;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    }
    .globe-stat .num { font-size: min(36px, 8vmin); font-weight: 800; color: #fff; line-height: 1; }
    .globe-stat .label { font-size: min(10px, 2.2vmin); font-weight: 600; color: rgba(255,255,255,0.6);
      text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }

    /* ── Title ────────────────────────────────────── */
    .title { text-align: center; margin-bottom: min(12px, 2.5vmin); flex-shrink: 0; }
    .title h1 { font-size: clamp(20px, 5.5vmin, 32px); font-weight: 800; letter-spacing: -0.02em; }
    .title h1 span { color: var(--gold); }
    .title p { font-size: clamp(11px, 2.5vmin, 14px); color: var(--muted); margin-top: 2px; }

    /* ── Spawn card ────────────────────────────────── */
    .spawn-card {
      width: 100%; max-width: 340px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: min(14px, 3vmin); padding: min(14px, 3vmin) min(16px, 3.5vmin);
      flex-shrink: 0; margin-bottom: min(10px, 2vmin);
    }
    .human-row { display: flex; align-items: center; gap: min(12px, 2.5vmin); margin-bottom: min(12px, 2.5vmin); }
    #human {
      width: 44px; height: 52px; image-rendering: pixelated;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,224,138,0.3);
      border-radius: 6px; flex-shrink: 0;
    }
    .human-info .name { font-size: min(17px, 3.8vmin); font-weight: 700; color: var(--gold); }
    .human-info .desc { font-size: min(11px, 2.4vmin); color: var(--muted); margin-top: 1px; }
    .spawn-actions { display: flex; gap: min(8px, 1.8vmin); }
    .btn-enter {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: min(5px, 1vmin);
      padding: min(11px, 2.5vmin) min(14px, 3vmin); border: none; border-radius: min(10px, 2.2vmin);
      background: linear-gradient(135deg, var(--gold), #f0a63c);
      color: #1a1205; font: 700 min(13px, 3vmin) -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer; transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 4px min(16px, 3.5vmin) rgba(255,180,60,0.3);
    }
    .btn-enter:hover { transform: translateY(-1px); }
    .btn-enter:active { transform: scale(0.97); }
    .btn-reroll {
      padding: min(11px, 2.5vmin) min(13px, 2.8vmin); border: 1px solid var(--border); border-radius: min(10px, 2.2vmin);
      background: var(--card); color: var(--text);
      font: 600 min(12px, 2.8vmin) -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-reroll:hover { background: rgba(255,255,255,0.08); }

    /* ── Feature pills ─────────────────────────────── */
    .features {
      display: flex; flex-wrap: wrap; justify-content: center; gap: min(5px, 1.2vmin);
      max-width: 420px; margin-bottom: min(8px, 1.8vmin); flex-shrink: 0;
    }
    .pill {
      display: flex; align-items: center; gap: 4px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: min(8px, 1.8vmin); padding: min(5px, 1.2vmin) min(8px, 1.8vmin);
      font-size: min(10px, 2.3vmin); color: var(--muted);
    }

    /* ── Footer ────────────────────────────────────── */
    .footer { font-size: min(9px, 2vmin); color: rgba(122,143,166,0.5); text-align: center; flex-shrink: 0; }

    /* ── Loading overlay ───────────────────────────── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 999; background: var(--bg);
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    #loading-overlay.show { display: flex; }
    .loader-ring {
      width: 36px; height: 36px; border: 3px solid rgba(255,210,63,0.15);
      border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { color: var(--muted); font-size: 13px; }
    body.zooming { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }

    /* ── Small screens (under 380px) ──────────────── */
    @media (max-height: 640px) {
      #globe-wrap { margin-bottom: 8px; }
      .title { margin-bottom: 6px; }
      .spawn-card { margin-bottom: 6px; padding: 10px 14px; }
      .human-row { margin-bottom: 8px; }
      .features { gap: 4px; margin-bottom: 4px; }
      .pill { padding: 3px 6px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="loading-overlay"><div class="loader-ring"></div><div class="loader-text">Entering the world…</div></div>

  <div id="globe-wrap">
    <canvas id="globe-canvas" width="400" height="400"></canvas>
    <div class="globe-stat">
      <div class="num" id="player-count">1</div>
      <div class="label">online</div>
    </div>
  </div>

  <div class="title">
    <div style="font-size: 9px; font-weight: 500; color: rgba(255, 210, 63, 0.55); margin-bottom: 2px;">v53</div>
    <h1><span>Pixel World</span></h1>
    <p>Multiplayer pixel campfire · No sign-up required</p>
  </div>

  <div class="spawn-card">
    <div class="human-row">
      <canvas id="human" width="52" height="60"></canvas>
      <div class="human-info">
        <div class="name" id="human-name">Grok</div>
        <div class="desc" id="human-desc">caveman · adult</div>
      </div>
    </div>
    <div class="spawn-actions">
      <button class="btn-reroll" id="reroll">🎲</button>
      <button class="btn-enter" id="spawn">🌍 Enter the world</button>
    </div>
  </div>

  <div class="features">
    <div class="pill">🕹️ Joystick</div>
    <div class="pill">💬 Chat</div>
    <div class="pill">👆 Drag to look</div>
    <div class="pill">👥 Live players</div>
  </div>

  <div class="footer">MQTT-powered · Zero accounts</div>

  <script>
    // ================================================================
    // 1. 3D Rotating Earth Globe (canvas 2D — lightweight, no THREE.js)
    // ================================================================
    (function () {
      const cv = document.getElementById('globe-canvas');
      const ctx = cv.getContext('2d');
      const W = cv.width, H = cv.height, CX = W / 2, CY = H / 2, R = W * 0.42;
      let angle = 0;

      // procedural earth texture
      const texW = 256, texH = 128;
      const texC = document.createElement('canvas');
      texC.width = texW; texC.height = texH;
      const tg = texC.getContext('2d');
      const imgData = tg.createImageData(texW, texH);
      const px = imgData.data;
      for (let y = 0; y < texH; y++) {
        const lat = (y / texH - 0.5) * Math.PI;
        for (let x = 0; x < texW; x++) {
          const lon = (x / texW) * Math.PI * 2;
          const nx = Math.cos(lat) * Math.cos(lon);
          const ny = Math.sin(lat);
          const nz = Math.cos(lat) * Math.sin(lon);
          const v = Math.sin(nx * 3.2 + 0.5) * Math.cos(ny * 2.8 - 0.3) * Math.sin(nz * 2.5 + 1.1)
            + Math.sin(nx * 6.1 + ny * 4.3) * 0.3
            + Math.cos(nz * 7.2 - nx * 2.1) * 0.2;
          const land = v > 0.15;
          let r, g, b;
          if (Math.abs(lat) > 1.1) { r = 236; g = 241; b = 248; }
          else if (land) {
            const elev = (v - 0.15) / 0.85;
            if (elev > 0.65) { r = 130; g = 125; b = 115; }
            else { r = 55 + elev * 30; g = 120 + elev * 10; b = 48 + elev * 10; }
          } else {
            const deep = (0.15 - v) / 0.8;
            r = 20 + deep * 10; g = 60 + deep * 20; b = 110 + deep * 30;
          }
          const i = (y * texW + x) * 4;
          px[i] = r; px[i + 1] = g; px[i + 2] = b; px[i + 3] = 255;
        }
      }
      tg.putImageData(imgData, 0, 0);

      function draw() {
        angle += 0.004;
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        for (let sy = -R; sy <= R; sy += 1.5) {
          const sliceR = Math.sqrt(R * R - sy * sy);
          if (sliceR < 1) continue;
          const lat = Math.asin(sy / R);
          for (let sx = -sliceR; sx <= sliceR; sx += 1.5) {
            const lon = Math.atan2(sx, Math.sqrt(sliceR * sliceR - sx * sx)) + angle;
            const tx = ((lon / (Math.PI * 2)) % 1 + 1) % 1;
            const ty = (lat / Math.PI) + 0.5;
            const px2 = Math.floor(tx * texW) % texW;
            const py2 = Math.max(0, Math.min(texH - 1, Math.floor(ty * texH)));
            const i = (py2 * texW + px2) * 4;
            let r = px[i], g = px[i + 1], b = px[i + 2];
            const nx3 = sx / R, ny3 = sy / R, nz3 = Math.sqrt(Math.max(0, 1 - nx3 * nx3 - ny3 * ny3));
            const light = Math.max(0.35, ny3 * -0.3 + nz3 * 0.85 + 0.15);
            r = Math.min(255, r * light); g = Math.min(255, g * light); b = Math.min(255, b * light);
            ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
            ctx.fillRect(CX + sx - 0.75, CY + sy - 0.75, 2, 2);
          }
        }
        const grad = ctx.createRadialGradient(CX, CY, R * 0.92, CX, CY, R * 1.08);
        grad.addColorStop(0, 'rgba(100,180,255,0)');
        grad.addColorStop(0.6, 'rgba(100,180,255,0.08)');
        grad.addColorStop(1, 'rgba(100,180,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(CX, CY, R * 1.08, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // ================================================================
    // 2. Static online counter via MQTT
    // ================================================================
    (function () {
      const TOPIC = 'pixelworld/demo/v1';
      const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
      const TTL = 45000;
      const players = new Map();
      const countEl = document.getElementById('player-count');
      function update() { countEl.textContent = Math.max(1, players.size); }
      function sweep() {
        const now = Date.now();
        for (const [id, ts] of players) if (now - ts > TTL) players.delete(id);
        update();
      }
      setInterval(sweep, 5000);
      function connect(i) {
        if (i >= BROKERS.length || typeof mqtt === 'undefined') { update(); return; }
        const c = mqtt.connect(BROKERS[i], {
          clientId: 'pw-page-' + Math.random().toString(36).slice(2, 10),
          connectTimeout: 8000, reconnectPeriod: 5000, keepalive: 30,
        });
        let once = false;
        c.on('connect', () => { once = true; c.subscribe([TOPIC + '/presence/+', TOPIC + '/pos'], { qos: 0 }, () => update()); });
        c.on('message', (topic, payload) => {
          const txt = payload.toString();
          if (topic.startsWith(TOPIC + '/presence/')) {
            const id = topic.slice(topic.lastIndexOf('/') + 1);
            if (!txt) players.delete(id);
            else try { players.set(JSON.parse(txt).id, Date.now()); } catch (e) {}
          } else if (topic.endsWith('/pos')) {
            try { const m = JSON.parse(txt); if (m.id) players.set(m.id, Date.now()); } catch (e) {}
          }
          update();
        });
        c.on('close', () => { if (!once) setTimeout(() => connect(i + 1), 800); });
      }
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js';
      s.onload = () => connect(0);
      document.head.appendChild(s);
    })();

    // ================================================================
    // 3. Human pixel-art preview
    // ================================================================
    const CAVEMAN = [
      '.....HHHHHH.....','....HHHHHHHH....','....HHHHHHHH....',
      '....HSSSSSSH....','....HSESSESH....','....HSSSSSSH....',
      '....HSHHHHSH....','.....HHHHH......','......SS........',
      '.....SSSS.......','....SSSSSS......','...SSCCCCSS.....',
      '...SSCCCCSS.....','...SSCCCCSS.....','....CCCCCC......',
      '....SS..SS......','....SS..SS......','....SS..SS......','....SS..SS......',
    ];
    const CAVEMAN_PAL = { H:'#3b2b1e', S:'#c78d5a', E:'#1a1a1a', C:'#8a5a33' };
    const CAVEWOMAN = [
      '.....HHHHHH.....','....HHHHHHHH....','....HHHHHHHH....',
      '....HSSSSSSH....','....HSESSESH....','....HSSSSSSH....',
      '....HSHHHHSH....','.....HHHHHH.....','....HH.SS.HH....',
      '....HH.SS.HH....','.....SSSS.......','....SSSSSS......',
      '..SSDDDDDDSS....','...SDDDDDDS.....','...DDDDDDDD.....',
      '....DDDDDD......','....SS..SS......','....SS..SS......','....SS..SS......',
    ];
    const CAVEWOMAN_PAL = { H:'#5a3a22', S:'#d29a66', E:'#1a1a1a', C:'#9a6a3f', D:'#6b8f3f' };
    const M_NAMES = ['Grok','Uga','Zog','Bruk','Tonk','Ogg','Kru','Mog'];
    const F_NAMES = ['Aya','Sula','Neya','Mara','Ika','Ona','Tia','Ula'];
    const SKINS = ['#f2c99b','#e0aa7a','#c78d5a','#a9714b','#8a5a3a','#6e452c'];
    const HAIRS = ['#191919','#3b2b1e','#5a3a22','#7a5230','#96613a','#b8863b','#a33c2a'];
    const CLOTHS = ['#8a5a33','#6b8f3f','#7a5230','#96613a','#5e7a46','#8f6a4a'];
    const DRESSES = ['#6b8f3f','#5e7a46','#7fa04a','#4f6f3a','#b07850'];
    const EYES = ['#1a1a1a','#2e3a5e','#2e4a2e','#5e3a1e'];

    function mulberry32(a) {
      return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    function pick(arr, rnd) { return arr[Math.floor(rnd() * arr.length)]; }

    let currentLook = null;
    function rollHuman() {
      const rnd = mulberry32((Math.random() * 0xffffffff) >>> 0);
      const female = Math.random() < 0.5;
      const skin = pick(SKINS, rnd), hair = pick(HAIRS, rnd), cloth = pick(CLOTHS, rnd), eye = pick(EYES, rnd);
      const dress = female ? pick(DRESSES, rnd) : null;
      const style = Math.floor(rnd() * (female ? 3 : 4));
      const beard = female ? -1 : Math.floor(rnd() * 3);
      const name = pick(female ? F_NAMES : M_NAMES, rnd);
      const age = 18 + Math.floor(rnd() * 35);
      const base = female ? CAVEWOMAN : CAVEMAN;
      const pal = { ...(female ? CAVEWOMAN_PAL : CAVEMAN_PAL) };
      pal.S = skin; pal.H = hair; pal.E = eye;
      if (female) pal.D = dress; else pal.C = cloth;
      const g = base.map(r => r.split(''));
      const put = (r, c, ch) => { if (r >= 0 && r < g.length && c >= 0 && c < g[0].length && g[r][c] === '.') g[r][c] = ch; };
      if (!female) {
        if (style === 1) for (let r = 1; r <= 4; r++) put(r, 12, 'H');
        if (style === 2) for (let r = 7; r <= 9; r++) { put(r, 3, 'H'); put(r, 12, 'H'); }
        if (style === 3) for (let c = 5; c <= 10; c++) if (g[2] && g[2][c] === 'H') g[2][c] = 'C';
        if (beard === 1) { put(8, 6, 'H'); put(8, 7, 'H'); }
        if (beard === 2) put(8, 7, 'H');
      } else {
        if (style === 1) for (let r = 9; r <= 12; r++) put(r, 12, 'H');
        if (style === 2) put(1, 12, 'D');
      }
      const art = g.map(r => r.join(''));
      const cv = document.getElementById('human');
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, cv.width, cv.height);
      const cols = art[0].length, rows = art.length, s = 2;
      const ox = Math.floor((cv.width - cols * s) / 2);
      const oy = Math.floor((cv.height - rows * s) / 2);
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const c = pal[art[y][x]]; if (!c) continue;
        ctx.fillStyle = c; ctx.fillRect(ox + x * s, oy + y * s, s, s);
      }
      document.getElementById('human-name').textContent = name;
      document.getElementById('human-desc').textContent = (female ? 'cavewoman' : 'caveman') + ' · ' + age + ' yrs';
      currentLook = { female, name, age, skin, hair, grey: '#c9c9c9', cloth, dress, eyes: eye, style, beard };
    }
    document.getElementById('reroll').addEventListener('click', rollHuman);
    rollHuman();

    // ================================================================
    // 4. Spawn → zoom + navigate
    // ================================================================
    document.getElementById('spawn').addEventListener('click', (e) => {
      e.preventDefault();
      const L = currentLook;
      const p = new URLSearchParams({
        demo: '1', n: L.name, f: L.female ? '1' : '0', a: String(L.age),
        skin: L.skin, hair: L.hair, grey: L.grey, cloth: L.cloth, eyes: L.eyes,
        style: String(L.style), beard: String(Math.max(0, L.beard)),
      });
      if (L.dress) p.set('dress', L.dress);
      document.body.classList.add('zooming');
      setTimeout(() => {
        document.getElementById('loading-overlay').classList.add('show');
        setTimeout(() => { window.location.href = 'index.html?' + p.toString(); }, 400);
      }, 500);
    });
  </script>
</body>
</html>
